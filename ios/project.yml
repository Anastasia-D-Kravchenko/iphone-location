name: LocationRemote
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
targets:
  LocationRemote:
    type: application
    platform: iOS
    sources:
      - path: LocationRemote
      - path: Vendor/idevice/module.modulemap
        buildPhase: none
      - path: Vendor/idevice/idevice.h
        buildPhase: none
    settings:
      base:
        # Both come from ios/local.env (build_install.sh exports them before xcodegen).
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/Vendor/idevice"]
        OTHER_LDFLAGS: ["$(inherited)", "-lidevice_ffi", "-lc++", "-lz"]
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        ENABLE_BITCODE: NO
    info:
      path: LocationRemote/Info.plist
      properties:
        CFBundleDisplayName: Location
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Shows where you are on the map.
        NSLocationAlwaysAndWhenInUseUsageDescription: Keeps the app running in the background so the fake location and its timer keep working.
        UIBackgroundModes: [location, audio, bluetooth-central]
        NSBonjourServices: [_remotepairing._tcp, _remotepairing-pairable-host._tcp, _remotepairing-manual-pairing._tcp, _remoted._tcp, _rp-tunnel._tcp]
        LSApplicationQueriesSchemes: [localdevvpn]
        CFBundleURLTypes:
          - CFBundleURLName: ${BUNDLE_ID}
            CFBundleURLSchemes: [locationremote]
        NSBluetoothAlwaysUsageDescription: Talks to your Apple Watch to move its location without the Mac.
        NSLocalNetworkUsageDescription: Connects to your Mac, which moves the location of your iPhone and Apple Watch.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
